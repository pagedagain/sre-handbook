site_name: PagedAgain Handbook
site_description: A practical SRE handbook for Linux and production incident response.
site_url: https://handbook.pagedagain.com
repo_url: https://github.com/pagedagain/sre-handbook
repo_name: pagedagain/sre-handbook
theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon.ico
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
plugins:
  - search
  - tags
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
nav:
  - Home: index.md
  - Interview Explainers:
      - What Happens When You Type a URL: interview/what-happens-when-you-type-a-url.md
  - Core Concepts:
      - Linux Memory Management: concepts/linux-memory-management.md
  - Browse by Topic: tags.md
